# -- v1.1: English glosses and example sentences -------------------------
# `python -m scripts.gloss` asks Claude for a gloss, an example sentence
# taken verbatim from the corpus, and its translation, for each of the
# 10,000 published rows. Everything the run depends on is pinned here and
# recorded in every cached response, so a change to any of it invalidates
# the cache rather than silently mixing two vintages of gloss.
gloss:
  model: claude-opus-5        # exact model id, never a date-suffixed alias
  # A ceiling, not a setting: it is deliberately not part of the cache key.
  # Nine rows of the first run hit 1000 -- adaptive thinking occasionally runs
  # long on a word with twenty noisy sentences -- and were truncated.
  max_tokens: 2000
  max_attempts: 3             # an errored reply is re-asked, up to this many
  effort: low                 # output_config.effort; the task is short
  thinking: adaptive          # adaptive | disabled
  # There is no temperature knob on this model family: the parameter was
  # removed with Claude 4.7 and the SDK (anthropic 1.8.0) does not accept
  # it, so a request cannot ask for temperature 0. Repeatability comes from
  # the response cache instead: cache/gloss/ keeps every raw response, and
  # a rerun re-sends only the rows whose model, prompt or inputs changed.
  temperature: null
  prompt_path: scripts/gloss_prompt.md
  cache_dir: cache/gloss      # raw responses, keyed by lemma + POS; gitignored
  out_file: glosses.tsv       # written into paths.out_dir; committed
  gates_file: gloss_gates.md  # written into paths.reports_dir
  # Human decisions, as everywhere else in eval/: a row here wins over the
  # model's answer for the fields it fills in. Seeded with the one word the
  # model refuses to gloss at all.
  overrides_file: gloss_overrides.tsv   # read from paths.eval_dir
  # What each `source` value reads as on a card. The deck publishes this as
  # Gloss_Source, so a learner can see where a gloss and its example came
  # from; out/glosses.tsv carries the bare value. The field itself arrives
  # with the glossed deck.
  source_labels:
    model: "Claude; example taken verbatim from the corpus"
    override: "written by hand"
    override-chosen: "corpus line chosen by a native speaker"
    override-edited: "corpus line, edited by a native speaker"
  # What the machine can check about a finished run (scripts/gloss_gates.py).
  # Provenance and shape only: whether a gloss is right is a question for the
  # reader, which is what the review file is for.
  gates:
    max_senses: 3             # the prompt asks for one to three
    max_words_per_sense: 8    # it asks for six; eight is where it fails
    max_missing_example_share: 0.05   # entries with no example sentence
    # Words the model will not gloss even after max_attempts tries. One is a
    # fact about the model's safety classifiers, not a broken run; the report
    # names every one. A run that loses more than this has something wrong.
    # Zero: eval/gloss_overrides.tsv is where a word the model will not gloss
    # gets one, so a missing gloss is now a thing to fix rather than tolerate.
    max_missing_gloss: 0
  # The human review sample: every row a learner meets first, plus a spread
  # over the rest.
  review:
    file: gloss_review.tsv    # written into paths.eval_dir
    all_through_rank: 500
    sampled: 200              # from all_through_rank + 1 to the last rank
    bands: 20                 # the sample is spread evenly over this many
    seed: 20260925
  batch:
    poll_seconds: 60
    chunk: 2500               # requests per batch; 10,000 rows is ~50 MB
    state_file: cache/gloss/batch.json
  # Which corpus lines may be offered as an example.
  sentences:
    max_per_row: 20
    min_words: 4
    max_words: 15
    max_proper_noun_share: 0.34   # capitalized non-dictionary words per line
    drop_all_caps: true
    drop_ellipsis_edges: true     # a line that starts or ends mid-sentence
    # ser and ir share foi/fui/fomos/foram/fora, and the lemma map assigns
    # all of them to ser (serir.py splits the counts, not the sentences),
    # so neither entry is offered a sentence whose only evidence is a form
    # that could belong to the other verb.
    exclude_joint_serir: true
  # The 50-row dry run: eval/gloss_dryrun.tsv.
  dryrun:
    file: gloss_dryrun.tsv      # written into paths.eval_dir
    seed: 20260924
    strata:                     # [first rank, last rank, how many]
      - [1, 100, 10]
      - [101, 2000, 20]
      - [2001, 10000, 20]
    require:                    # drawn inside the strata, not added to them
      multi_pos: 3              # words the list splits across two POS rows
      mwe: 2
      kept_feminine_nouns: 2    # convention 2: senhora, menina, miúda, ...
